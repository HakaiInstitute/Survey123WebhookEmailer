name: Build and Bump
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hakaiinstitute/survey123-webhooks
          tags: type=sha,prefix=sha-,format=short
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: hakai-it
          password: ${{ secrets.CI_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: HakaiInstitute/hakai-webapps-stacks-uvic1_server_hakai_app
          token: ${{ secrets.CI_TOKEN }}
      - name: Bump image tag
        env:
          IMAGE: ghcr.io/hakaiinstitute/survey123-webhooks
          TAG: ${{ needs.build.outputs.tag }}
          STACK_DIR: survey123-webhooks
        run: |
          set -euo pipefail
          cd "$STACK_DIR"

          # Assert the line exists BEFORE editing. A sed that matches nothing
          # exits 0 and changes nothing — the deploy then silently no-ops while
          # the workflow reports success. This is exactly how the first
          # hakai-data bump failed: the compose file still said
          # `img-captain-hakai-data`, so the pattern never matched.
          if ! grep -q "image: ${IMAGE}:" docker-compose.yml; then
            echo "::error::No 'image: ${IMAGE}:' line in ${STACK_DIR}/docker-compose.yml"
            grep -n 'image:' docker-compose.yml || true
            exit 1
          fi

          sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${TAG}|" docker-compose.yml

          # Re-running the same commit (re-run, retag, no-op push) is not a failure.
          if git diff --quiet; then
            echo "Already at ${TAG} — nothing to commit."
            exit 0
          fi

          git config user.name  'hakai-ci'
          git config user.email 'hakai-it@hakai.org'
          git commit -am "deploy ${STACK_DIR} ${TAG}"

          # Five app repos push to this one repo; two merging at once will race.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt ${attempt}) — rebasing"
            git pull --rebase
          done
          echo "::error::push failed after 3 attempts"
          exit 1
