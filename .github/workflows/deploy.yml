name: Deploy to Caprover

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Caprover CLI
        run: npm install -g caprover

      - name: Deploy to Caprover
        env:
          CAPROVER_URL: ${{ secrets.CAPROVER_URL }}
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}
          CAPROVER_APP_NAME: ${{ secrets.CAPROVER_APP_NAME }}
        run: |
          # Create a tarball of the application
          tar -czf deploy.tar.gz --exclude='.git' --exclude='node_modules' --exclude='.venv' --exclude='__pycache__' --exclude='.idea' --exclude='.ruff_cache' .

          # Deploy to Caprover
          caprover deploy \
            --caproverUrl "$CAPROVER_URL" \
            --caproverPassword "$CAPROVER_PASSWORD" \
            --appName "$CAPROVER_APP_NAME" \
            --tarFile deploy.tar.gz

      - name: Deployment Complete
        run: echo "Deployment to Caprover completed successfully!"
